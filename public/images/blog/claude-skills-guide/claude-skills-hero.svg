<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="64" y="80" width="500" height="470" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Glow orb top-right -->
  <circle cx="980" cy="120" r="220" fill="url(#glowGrad)" opacity="0.6"/>

  <!-- Accent top bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- ── LEFT: Terminal card ── -->
  <rect x="64" y="80" width="500" height="470" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <!-- Terminal chrome -->
  <rect x="64" y="80" width="500" height="44" rx="16" fill="#1e293b"/>
  <rect x="64" y="108" width="500" height="16" fill="#1e293b"/>
  <!-- Traffic lights -->
  <circle cx="102" cy="102" r="7" fill="#ef4444"/>
  <circle cx="124" cy="102" r="7" fill="#f59e0b"/>
  <circle cx="146" cy="102" r="7" fill="#22c55e"/>
  <!-- Terminal title -->
  <text x="282" y="107" font-family="monospace" font-size="13" fill="#64748b" text-anchor="middle">~/.agents/skills/</text>

  <!-- Terminal content lines -->
  <text x="96" y="158" font-family="monospace" font-size="13" fill="#64748b">$ ls ~/.agents/skills/</text>

  <!-- Skill entries with color coding -->
  <text x="96" y="184" font-family="monospace" font-size="12.5" fill="#38bdf8">daily-summary/</text>
  <text x="96" y="204" font-family="monospace" font-size="12.5" fill="#38bdf8">frontend-design/</text>
  <text x="96" y="224" font-family="monospace" font-size="12.5" fill="#38bdf8">security-review/</text>
  <text x="96" y="244" font-family="monospace" font-size="12.5" fill="#38bdf8">tdd-workflow/</text>
  <text x="96" y="264" font-family="monospace" font-size="12.5" fill="#38bdf8">blog-writer/</text>
  <text x="96" y="284" font-family="monospace" font-size="12.5" fill="#64748b">...and 93 more</text>

  <!-- Divider -->
  <line x1="96" y1="302" x2="540" y2="302" stroke="#1e3a5f" stroke-width="1"/>

  <!-- install command -->
  <text x="96" y="328" font-family="monospace" font-size="13" fill="#64748b">$ npx skills add</text>
  <text x="96" y="348" font-family="monospace" font-size="13" fill="#a78bfa">  ajay-mandal/agent-skills</text>

  <!-- Output -->
  <text x="96" y="378" font-family="monospace" font-size="12" fill="#4ade80">✓  Installing daily-summary...</text>
  <text x="96" y="396" font-family="monospace" font-size="12" fill="#4ade80">✓  Skill ready in ~/.agents/skills/</text>
  <text x="96" y="414" font-family="monospace" font-size="12" fill="#4ade80">✓  Active in: Copilot · Claude Code</text>
  <text x="96" y="432" font-family="monospace" font-size="12" fill="#4ade80">✓  Active in: Cursor · Cline · Windsurf</text>

  <!-- Divider -->
  <line x1="96" y1="452" x2="540" y2="452" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Prompt cursor -->
  <text x="96" y="478" font-family="monospace" font-size="13" fill="#6366f1">$ _</text>
  <rect x="104" y="463" width="9" height="16" fill="#6366f1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ── RIGHT: Info panel ── -->

  <!-- Tagline -->
  <text x="620" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#6366f1" letter-spacing="3">AGENT SKILLS ECOSYSTEM</text>

  <!-- Main title -->
  <text x="620" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white">Claude Skills</text>
  <text x="620" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white">Guide</text>

  <!-- Accent underline -->
  <rect x="620" y="272" width="280" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Subtitle -->
  <text x="620" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8">Build · Install · Publish</text>
  <text x="620" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8">Reusable AI Workflows</text>

  <!-- Three feature pills -->
  <!-- Pill 1 -->
  <rect x="620" y="385" width="162" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="701" y="409" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">18+ AI Agents</text>

  <!-- Pill 2 -->
  <rect x="796" y="385" width="162" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="877" y="409" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a78bfa" text-anchor="middle">98 Skills</text>

  <!-- Pill 3 -->
  <rect x="620" y="437" width="162" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="701" y="461" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle">Open Standard</text>

  <!-- Pill 4 -->
  <rect x="796" y="437" width="162" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="877" y="461" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fb923c" text-anchor="middle">VS Code Ready</text>

  <!-- Bottom attribution -->
  <text x="620" y="545" font-family="monospace" font-size="13" fill="#475569">skills.sh · github.com/ajay-mandal</text>
  <text x="620" y="568" font-family="monospace" font-size="13" fill="#334155">ajaymandal.com</text>

  <!-- Connecting dots / node graph decoration (right edge) -->
  <g opacity="0.3" filter="url(#glow)">
    <circle cx="1100" cy="300" r="6" fill="#6366f1"/>
    <circle cx="1150" cy="240" r="4" fill="#38bdf8"/>
    <circle cx="1160" cy="360" r="5" fill="#a78bfa"/>
    <circle cx="1080" cy="420" r="3" fill="#38bdf8"/>
    <circle cx="1130" cy="480" r="4" fill="#6366f1"/>
    <line x1="1100" y1="300" x2="1150" y2="240" stroke="#6366f1" stroke-width="1"/>
    <line x1="1100" y1="300" x2="1160" y2="360" stroke="#38bdf8" stroke-width="1"/>
    <line x1="1160" y1="360" x2="1080" y2="420" stroke="#a78bfa" stroke-width="1"/>
    <line x1="1080" y1="420" x2="1130" y2="480" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentGrad)" opacity="0.5"/>
</svg>
